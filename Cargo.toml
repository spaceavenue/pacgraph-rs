[package]
name = "pacgraph-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pacgraph"
path = "./src/main.rs"

[dependencies]
anyhow = "1.0.104"
petgraph = "0.8.3"

[dependencies.clap]
version = "4.6.7"
default-features = false
features = ["std", "derive", "help", "usage", "error-context", "color"]
